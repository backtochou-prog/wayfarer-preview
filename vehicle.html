<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Le véhicule — tous les angles</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070612; color: #e8e4ff; font: 15px/1.3 system-ui, sans-serif; overscroll-behavior: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(7,6,18,.85) 40%); }
  button { font: inherit; color: #e8e4ff; background: #1d1838; border: 1px solid #5b3fa8; border-radius: 10px; padding: 10px 14px; min-width: 64px; }
  button:active, button.on { background: #5b2fb8; border-color: #ff6ad8; }
  #hint { position: fixed; top: 0; left: 0; right: 0; text-align: center; padding: calc(10px + env(safe-area-inset-top)) 12px 0; color: #b9a9ff; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #name { position: fixed; top: calc(40px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 12px; color: #8c7fc7; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hint">Glisse pour tourner · pince ou molette pour zoomer · double toucher = recentrer</div>
<div id="name" id="view">vue : 3/4 arrière</div>
<div id="bar">
  <button data-v="back">Dos</button><button data-v="front">Face</button><button data-v="left">Gauche</button><button data-v="right">Droite</button>
  <button data-v="top">Dessus</button><button data-v="bottom">Dessous</button><button data-v="q">3/4</button><button id="spin" class="on">Rotation auto</button>
</div>
<script src="vendor/three.min.js"></script>
<script src="src3d/hover_vehicle.js"></script>
<script>
(() => {
  const cv = document.getElementById('gl'), label = document.getElementById('name');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: false, preserveDrawingBuffer: /[?&]shot\b/.test(location.search) });
  renderer.setClearColor(0x070612, 1);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
  // a faint floor ring and stars so the eye has something to turn against
  const stars = new Float32Array(900); for (let i = 0; i < 300; i++) { const a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1), r = 60; stars[3 * i] = r * Math.sin(b) * Math.cos(a); stars[3 * i + 1] = r * Math.cos(b); stars[3 * i + 2] = r * Math.sin(b) * Math.sin(a); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(stars, 3)); scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xbdb4ff, size: 0.18 })));
  const floor = new THREE.Mesh(new THREE.RingGeometry(3.2, 3.26, 96), new THREE.MeshBasicMaterial({ color: 0x4b3a8a, side: THREE.DoubleSide })); floor.rotation.x = -Math.PI / 2; floor.position.y = -1.3; scene.add(floor);
  const V = HoverVehicle.build(THREE); scene.add(V.group);
  // the view: yaw 0 = looking at the BACK (the picture's side, +Z), pitch up positive; the vehicle's nose is -Z
  let yaw = 0.5, pitch = 0.32, dist = 6.8, auto = true, tYaw = yaw, tPitch = pitch, tDist = dist;
  const VIEWS = { back: [0, 0.3, 'dos'], front: [Math.PI, 0.18, 'face'], left: [-Math.PI / 2, 0.12, 'gauche'], right: [Math.PI / 2, 0.12, 'droite'], top: [0, 1.5, 'dessus'], bottom: [0, -1.4, 'dessous'], q: [0.6, 0.34, '3/4 arrière'] };
  const set = (k) => { const v = VIEWS[k]; let d = v[0] - tYaw; d = Math.atan2(Math.sin(d), Math.cos(d)); tYaw += d; tPitch = v[1]; tDist = 6.8; label.textContent = 'vue : ' + v[2]; auto = false; document.getElementById('spin').classList.remove('on'); };
  document.querySelectorAll('button[data-v]').forEach(b => b.addEventListener('click', () => set(b.dataset.v)));
  document.getElementById('spin').addEventListener('click', (e) => { auto = !auto; e.currentTarget.classList.toggle('on', auto); });
  // pointers: one finger / the mouse turns, two fingers pinch
  const P = new Map(); let pinch = 0;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]); auto = false; document.getElementById('spin').classList.remove('on'); label.textContent = 'vue libre'; });
  cv.addEventListener('pointermove', e => {
    if (!P.has(e.pointerId)) return; const o = P.get(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]);
    if (P.size === 1) { tYaw -= (e.clientX - o[0]) * 0.008; tPitch = Math.max(-1.5, Math.min(1.5, tPitch + (e.clientY - o[1]) * 0.006)); }
    else if (P.size === 2) { const [a, b] = [...P.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) tDist = Math.max(3.5, Math.min(18, tDist * pinch / d)); pinch = d; }
  });
  const up = e => { P.delete(e.pointerId); if (P.size < 2) pinch = 0; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); tDist = Math.max(3.5, Math.min(18, tDist * Math.exp(e.deltaY * 0.001))); }, { passive: false });
  cv.addEventListener('dblclick', () => { set('q'); });
  let lastTap = 0; cv.addEventListener('pointerup', e => { if (e.pointerType === 'touch') { const n = performance.now(); if (n - lastTap < 320) set('q'); lastTap = n; } });
  function resize() { const w = innerWidth, h = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2); renderer.setPixelRatio(dpr); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const clock = new THREE.Clock();
  window.__vehicle = { set, get view() { return { yaw, pitch, dist }; }, V };
  renderer.setAnimationLoop(() => {
    const dt = Math.min(0.1, clock.getDelta()), t = clock.elapsedTime;
    if (auto) tYaw += dt * 0.5;
    const k = 1 - Math.exp(-dt * 8); yaw += (tYaw - yaw) * k; pitch += (tPitch - pitch) * k; dist += (tDist - dist) * k;
    V.group.position.y = 0.08 * Math.sin(t * 1.4); V.update(t);
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
    camera.lookAt(0, 0.05, 0);
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
